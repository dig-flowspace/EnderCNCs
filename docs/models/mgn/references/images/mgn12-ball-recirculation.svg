<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-labelledby="title2 desc2">
  <title id="title2">How balls recirculate through a linear guide carriage</title>
  <desc id="desc2">Side view of a carriage on a rail. Balls carry load along the bottom of the block, are turned by the end caps, travel back through an unloaded return channel, and re-enter at the other end.</desc>

  <rect x="0" y="0" width="780" height="420" fill="#fbfbf9"/>

  <style>
    .lbl   { font: 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #1b1b1b; }
    .lbl-b { font: 600 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #1b1b1b; }
    .cap   { font: italic 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #555; }
    .ttl   { font: 600 16px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #1b1b1b; }
    .lead  { stroke: #777; stroke-width: 1; fill: none; }
  </style>

  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f4f"/>
    </marker>
    <marker id="dot2" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4">
      <circle cx="3" cy="3" r="2.4" fill="#777"/>
    </marker>
  </defs>

  <text class="ttl" x="30" y="36">The ball circuit — why travel is limited only by rail length</text>
  <text class="cap" x="30" y="56">Side view, schematic. The block is cut away so the circuit inside is visible.</text>

  <!-- rail -->
  <rect x="60" y="300" width="660" height="42" fill="#9aa3ab" stroke="#4a545e" stroke-width="2"/>
  <g fill="#7d868e" stroke="#4a545e" stroke-width="1.2">
    <ellipse cx="110" cy="321" rx="11" ry="6"/>
    <ellipse cx="230" cy="321" rx="11" ry="6"/>
    <ellipse cx="550" cy="321" rx="11" ry="6"/>
    <ellipse cx="670" cy="321" rx="11" ry="6"/>
  </g>
  <text class="cap" x="690" y="362" text-anchor="end">rail continues — the circuit never runs out</text>

  <!-- carriage body -->
  <rect x="250" y="150" width="290" height="150" rx="8" fill="#cfd6dd" stroke="#5d6b78" stroke-width="2"/>
  <!-- end caps -->
  <path d="M 250 158 Q 250 150 258 150 L 300 150 L 300 300 L 250 300 Z" fill="#dfa8a0" stroke="#5d6b78" stroke-width="2"/>
  <path d="M 490 150 L 532 150 Q 540 150 540 158 L 540 300 L 490 300 Z" fill="#dfa8a0" stroke="#5d6b78" stroke-width="2"/>

  <!-- return channel (unloaded) -->
  <rect x="300" y="176" width="190" height="32" rx="16" fill="#eef1f0" stroke="#8d9aa4" stroke-width="1.6"/>

  <!-- the loop path -->
  <path d="M 470 192 L 320 192" class="lead" stroke="#2f6f4f" stroke-width="2.5" marker-end="url(#flow)"/>
  <path d="M 320 278 L 470 278" class="lead" stroke="#2f6f4f" stroke-width="2.5" marker-end="url(#flow)"/>
  <path d="M 308 192 A 44 44 0 0 0 308 278" class="lead" stroke="#2f6f4f" stroke-width="2.5" marker-end="url(#flow)"/>
  <path d="M 482 278 A 44 44 0 0 0 482 192" class="lead" stroke="#2f6f4f" stroke-width="2.5" marker-end="url(#flow)"/>

  <!-- balls in the loaded zone (bottom, touching rail) -->
  <g>
    <circle cx="330" cy="288" r="11" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.7"/>
    <circle cx="356" cy="288" r="11" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.7"/>
    <circle cx="382" cy="288" r="11" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.7"/>
    <circle cx="408" cy="288" r="11" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.7"/>
    <circle cx="434" cy="288" r="11" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.7"/>
    <circle cx="460" cy="288" r="11" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.7"/>
  </g>
  <!-- balls in the return channel -->
  <g opacity="0.75">
    <circle cx="336" cy="192" r="10" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="362" cy="192" r="10" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="388" cy="192" r="10" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="414" cy="192" r="10" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="440" cy="192" r="10" fill="#f2f2f0" stroke="#3a3a3a" stroke-width="1.5"/>
  </g>

  <!-- labels -->
  <path class="lead" marker-end="url(#dot2)" d="M 180 178 L 276 172"/>
  <text class="lbl-b" x="60" y="166">End cap</text>
  <text class="lbl" x="60" y="182">turns the balls round</text>

  <path class="lead" marker-end="url(#dot2)" d="M 600 176 L 500 186"/>
  <text class="lbl-b" x="606" y="172">Return channel</text>
  <text class="lbl" x="606" y="188">carries no load</text>

  <path class="lead" marker-end="url(#dot2)" d="M 600 262 L 470 282"/>
  <text class="lbl-b" x="606" y="252">Load zone</text>
  <text class="lbl" x="606" y="268">these balls carry</text>
  <text class="lbl" x="606" y="284">everything</text>

  <path class="lead" marker-end="url(#dot2)" d="M 180 252 L 258 240"/>
  <text class="lbl" x="60" y="242">Carriage body</text>
</svg>
